  - description: The Olli Revival project at the CAVAS lab focuses on restoring an
      autonomous shuttle to full operational capacity through comprehensive firmware
      and software development. The core initiative centers on engineering a reliable
      drive by wire system and a modern ROS 2 driver stack utilizing C++, Python,
      and MATLAB Simulink. Essential tasks include developing low level vehicle control
      logic, managing CAN bus messaging, and integrating critical navigation sensors
      such as GNSS and IMU components into the updated architecture. By resolving
      system errors and modernizing legacy components, the project aims to establish
      a highly functional and safety critical autonomous research platform.
    team:
