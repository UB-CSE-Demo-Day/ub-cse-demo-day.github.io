- code: 'CSE 546: Reinforcement Learning'
  projects:
  - description: We built an automated pipeline to train a flight booking AI using
      Reinforcement Learning from AI Feedback (RLAIF). In this setup, our fine-tuned
      Mistral-7B agent practices negotiating with a simulated customer, generating
      multiple potential conversational pathways for every scenario. A strict AI judge
      then evaluates these transcripts, calculating a precise reward score by checking
      for successful bookings and heavily penalizing hallucinations. Finally, the
      pipeline uses a Best reinforcement learning strategy to compare these reward
      scores, saving only the most successful interaction to continuously improve
      the model's baseline behavior.
    team:
    - email: sa69@buffalo.edu
      name: Shubham Kumar Agrawal
    - email: ryadav4@buffalo.edu
      name: Rahul Yadav
