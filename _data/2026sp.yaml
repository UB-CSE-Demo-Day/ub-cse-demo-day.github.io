  - description: 'Brain tumors are among the most life-threatening conditions in modern
      medicine, and their early and accurate detection is critical for effective treatment
      planning. Magnetic Resonance Imaging (MRI) is the primary non-invasive technique
      used for brain tumor diagnosis. However, manual segmentation of tumor regions
      from MRI scans is time-consuming, labour-intensive, and subject to variability
      between clinicians. This project

      proposes an automated deep learning approach to brain tumor segmentation using
      U-Net, a convolutional neural network architecture widely adopted as the benchmark
      for medical image segmentation tasks. The model will be trained and evaluated
      on a publicly available MRI dataset, with the goal of accurately identifying
      and delineating tumor regions to assist radiologists in clinical settings'
