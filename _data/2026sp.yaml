- code: 676 Deep Learning Final Project
  projects:
  - description: 'Peptide and protein identification from tandem mass spectrometry
      (MS/MS) data is a central problem in proteomics. Database searching is a widely
      popular approach to solve this problem by matching observed spectra against
      a set of peptide sequences contained in a reference protein database. This approach
      is good for samples for which there is sufficient representation in the reference
      database. However, for complex biological samples, there may be proteins of
      unknown or poorly characterized or underrepresented species.

      This is particularly critical for wastewater samples, as wastewater may contain
      proteins from microorganisms, human sources, and environmental sources, many
      of which may not be well represented in reference databases. Therefore, a de
      novo approach to sequencing may be helpful, as it can predict peptide sequences
      based on spectra without relying on a reference database.'
    team:
    - email: rpandey3@buffalo.edu
      name: Raunak Kumar Pandey
    - email: swatisan@buffalo.edu
      name: Swati Sanjay Bhat
    - email: litheesh@buffalo.edu
      name: Litheesh Velakaturi Rambabu
    title: E. coli and Wastewater peptide sequencing using de novo tools
