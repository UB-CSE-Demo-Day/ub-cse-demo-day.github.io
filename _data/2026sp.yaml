- code: cse546 demo day
  projects:
  - description: "Today's WebRTC stack (Google Meet, Discord, Microsoft Teams, Zoom)\n\
      \  picks Forward Error Correction (FEC) redundancy with a hand-tuned       \
      \                          \n  threshold rule that saturates on cellular links\
      \ \u2014 wasting bandwidth\n  when the link is good and reacting too slowly\
      \ when it isn't. We                                   \n  train an offline reinforcement-learning\
      \ agent (CQL, BCQ, DQN)                                     \n  purely from\
      \ logs of the existing rule-based controller, following                    \
      \             \n  the recipe Mowgli (NSDI'25) used for sender-side rate control.\
      \ The                                \n  result: DQN beats the rule-based controller\
      \ by 23\xD7 reward across                                  \n  three real public\
      \ LTE/3G traces (Verizon, T-Mobile, Norway 3G),                            \
      \       \n  with seed-level statistical significance p < 10\u207B\u2074. We\
      \ validate                                    \n  end-to-end on a real H.264\
      \ RTP video stream traversing a Mahimahi-                                \n\
      \  shaped link with our own RFC 5109-compatible XOR FEC, where DQN         \
      \                          \n  delivers higher receiver-side PSNR using only\
      \ 0.6\u20135.5% bandwidth                                  \n  overhead vs.\
      \ the rule's 41\u201346%. We additionally provide stratified               \
      \                 \n  out-of-distribution Q-value analysis that mechanistically\
      \ explains                                \n  a counterintuitive finding: CQL\
      \ anchors to the rule-based attractor                               \n  across\
      \ a four-decade \u03B1-sweep \u2014 a rare published counterexample to     \
      \                            \n  the \"always pick CQL\" folklore in offline\
      \ RL.        "
    team:
    - email: qwu26@buffalo.edu
      name: Qiang Wu
    title: Offline Reinforcement Learning for Adaptive FEC Control in WebRTC
- code: CSE 799 Supervised Research
  projects:
  - description: "We build variational autoencoder models on real-world electronic\
      \ health record laboratory data across three routine panels: Complete Blood\
      \ Count (CBC), Comprehensive Metabolic Panel (CMP), and a Hepatic Function Panel\
      \ (HFP). The models learn a low-dimensional latent representation of jointly\
      \ observed analytes and handle incomplete panels via masked reconstruction loss\
      \ and, where explored, learned embeddings for missing inputs. We assess how\
      \ well each analyte can be predicted from the others (e.g. leave-one-feature-out\
      \ / masking analyses). For anomaly detection, we inject controlled synthetic\
      \ perturbations into analytes the model already predicts reliably, then use\
      \ reconstruction error relative to a data-driven threshold to test whether the\
      \ model flags these synthetic abnormalities. Together, this work evaluates whether\
      \ generative models can encode \u201Cnormal\u201D multivariate lab structure\
      \ and support principled, testable anomaly screening across panels."
    team:
    - email: kamakoti@buffalo.edu
      name: Kamakoti Jagannath Chivukula
    title: 'Modeling Lab Panels with VAEs: Reconstruction, and Synthetic Anomaly Detection'
