  - description: 'The objective of this project is to build an end-to-end big data
      pipeline to analyze Major League Baseball (MLB) player performances, their compensation,
      and predict their future offensive output. This problem falls under the sports
      analytics and finance domain. In professional sports, teams spend hundreds of
      millions of dollars building rosters. Understanding whether a player''s current
      on-field statistics, age, and physical traits can accurately forecast their
      next-season performance is critical for building a cost-effective, winning team.

