- code: CSE587
  projects:
  - description: "Churn is a metric that defines user retention in e-commerce businesses.\
      \ In this report, we are using the Online Retail dataset by UCI to predict the\
      \ user churn using machine learning concepts and EDA. Since the churn is not\
      \ mentioned explicitly, we defined it as customer inactivity over a prolonged\
      \ period of time. \n\nThe study involves cleaning and preprocessing the data\
      \ before it is fed to the machine learning models. We also did exploratory data\
      \ analysis (EDA) to get the basic trends in the data. Post that, three Machine\
      \ learning models were used: binary classification to predict whether a customer\
      \ will churn, linear regression to predict the time to churn, and clustering\
      \ to segment customers on the basis of purchasing behavior. \n"
    team:
