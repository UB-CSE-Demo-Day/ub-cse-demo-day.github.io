- code: CSE 587
  projects:
  - description: This project focuses on analyzing and predicting flight delays using
      a dataset containing various flight attributes such as departure times, arrival
      times, and other relevant factors. The dataset was first cleaned and preprocessed
      to ensure accuracy and usability. We then conducted exploratory data analysis
      to understand patterns, distributions, and relationships within the data. Building
      on these insights, we applied machine learning techniques to develop models
      that predict flight delays. This allowed us to better understand key factors
      influencing delays and evaluate their impact on both airlines and passengers.
