  - description: 'Cardiorespiratory Sound AI is a deep learning pipeline that automatically
      analyzes breath and heart sounds to detect abnormalities and diagnose diseases.

      The system processes raw audio recordings from patients, extracts ~180 acoustic
      features, and uses a multi-task neural network to simultaneously classify adventitious
      sounds (Normal, Crackle, Wheeze) and 8 respiratory diseases. It''s trained on
      multiple clinical datasets including ICBHI 2017, Zenodo, and PhysioNet, with
      a strict patient-grouped evaluation strategy to ensure reliable, real-world
      results.'
