    title: 'Traveler Tracker '
  - description: 'WiFi sensing is a technology that uses WiFi signals already emitted
      by wireless devices for the purpose of movement detection. These systems enable
      applications such as smart home automation, health monitoring, security, and
      even localization. However, these systems also create significant privacy concerns
      as channel information can reveal and track user locations without their consent.


      This project explores the application of differential privacy to WiFi sensing
      systems. Differential privacy introduces carefully created noise into the mechanisms
      that expose channel state information to clients utilizing the system. This
      noise is tuned to ensure that the presence or absence of any single individual
      yields near indistinguishable results on the output returned. The project aims
      to provide quantifiable privacy guarantees against unauthorized tracking and
      inference while still preserving the utility of sensing applications.'
    team:
    - email: holdenwo@buffalo.edu
      name: Holden Wozniak
    title: Differential Privacy for WiFi Sensing Systems
  - description: 'Language models are black boxes. You put text in, an answer comes
      out, and nothing in between is visible. LayerLens opens that box. It intercepts
      a model''s internal state at every layer and tracks how confidently it predicts
      each word as processing deepens.


      Words the model was about to get right but did not are called late-drop tokens.
      LayerLens flags these in real time. Across 32,000 words and two model architectures,
      these flagged words turn out to be wrong 86% of the time. That makes the trajectory
      shape a better uncertainty signal than the model''s own confidence score.


      The same analysis reveals something else. Simple words like "the" and "and"
      are resolved by the middle layers. The compute spent on them after that point
      is wasted. LayerLens measures exactly how much.


      Both findings are interactive. Type any sentence, watch the model think layer
      by layer, and see exactly where it hesitates.'
    team:
    - email: yrathi2@buffalo.edu
      name: Yash Rathi
    title: LayerLens
  - description: My research group at Roswell Park built an end-to-end VMAT dose prediction
