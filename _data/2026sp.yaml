      name: Anjan Dutta
    - email: jsyuan@buffalo.edu
      name: Junsong Yuan
    - email: doermann@buffalo.edu
      name: David Doermann
    title: 'RADI3N: Training-Free GeometRic ImAge EDiting vIa Parametric 3D CoNtrol'
