  - description: In data-free model merging, multiple task experts trained from a
      shared base model are combined into a single merged model without access to
      the original training data. This is valuable for reducing storage, privacy,
      and retraining overhead while preserving task performance. We propose a graph
      Laplacian-based approach that leverages learned task relationships to regularize
      the merge weights, encouraging similar tasks to receive similar contributions
      and thereby reducing destructive interference during merging
    team:
    - email: apaikrao@buffalo.edu
      name: Aditya Paikrao
    title: Graph Laplacian Merging
  - description: 'Recent diffusion-based methods have substantially advanced image
      editing, yet controlled geometric manipulation remains challenging. In particular,
      existing approaches struggle to provide parametric control over object transformations
      (e.g., translation, rotation, and scaling) and often fail to model lighting
      and shadow consistency, resulting in unrealistic outputs in geometry-intensive
      edits such as rotations or perspective changes.

      To address these limitations, we introduce RADI3N, a training-free framework
      that enables part-aware object manipulation with parametric 3D geometric control.
      Our approach incorporates a novel CS-ARAP deformation module to produce smoother
      and structurally consistent deformations under complex part-level edits. In
      addition, we mitigate appearance inconsistencies by introducing a diffusion-based
      appearance injection mechanism that transfers lighting and shadow cues to the
      edited geometry. Extensive experiments demonstrate that RADI3N achieves state-of-the-art
      performance in fidelity, viewpoint consistency, and controllability.'
    team:
    - email: alone@buffalo.edu
      name: Abdul Wasi
    - email: akhilven@buffalo.edu
