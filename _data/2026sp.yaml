  - description: 'The Bug Triage & Prioritization System (AI-Assisted) is a full-stack
      web application that facilitates developers to effectively organize and prioritize
      software bugs. Conventional bug tracking systems are primarily concerned with
      the collection and listing of bugs but they usually do not have any intelligent
      support in deciding on the bugs to be resolved first. The proposed project seeks
      to address that gap and integrate the regular bug tracking with the AI-enhanced
      analysis.


      The system enables users to file bug reports, monitor their status, assign ownership,
      and display bugs according to priority and not just in a chronological order.
      It also adds some important reliability impact and expected resolution time
      to better represent the reality of software running in the field.


      AI is implemented as a complementary feature to boost productivity and not to
      substitute human decision-making. Auto bug summarization, proposed severity
      and smart prioritization are some of the features that have been used to save
      time on the part of the developers that are analyzing bug reports. Moreover,
      the system will be able to produce the explanations of prioritization choices
      and emphasize the key, high-impact problems.


      In general, the project provides a realistic and scalable solution to enhance
      the efficiency of bug management, lighten the cognitive load of developers and
      facilitate the development of better decisions in the contemporary software
      development context.'
    team:
    - email: neeharpu@buffalo.edu
      name: Neehar Purama
    - email: mukeshkr@buffalo.edu
      name: Mukesh Krishnamurthy
