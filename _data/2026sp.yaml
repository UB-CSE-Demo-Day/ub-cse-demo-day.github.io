- code: CSE-711
  projects:
  - description: 'Wireless sensing has been widely studied for its applications in
      gesture recognition in recent years. Research has focused

      on how human movement can be detected through its impact on wireless signals
      in order to classify the movement into

      specific gestures. This project aims to expand beyond classification into the
      field of assessment.

      Certain applications benefit from information beyond classification, by instead
      learning about the gesture being performed.

      Specifically, in the field of fitness including the gym, sports, physical therapy,
      and other forms of exercise, the importance

      of maintaining form is evident. Focusing on the gym, maintaining form while
      you work out leads to increased effectiveness

      of the workout while also helping to prevent injury. Existing approaches to
      assist in maintaining form including vision

      based systems and wearable devices, can be expensive and inconvenient. To address
      this, we built a system to assess the

      quality of form while performing bicep curls through the use of wireless signals.

      Our system derives quality assessment through the use of WiFi CSI signals. The
      system will rely on two ESP32 microcon-

      trollers to collect CSI data, which will be processed into a time-frequency
      spectrogram representation, from which motion

      related features will be extracted and used to evaluate the quality of the curl
      being performed.

      The goal of this work is to determine if the pipeline can output a quality assessment
      of the curl. The final output of the

      pipeline will include a quality score for the curl, along with potential feedback
      for improvement of the gesture. Successful

      results will demonstrate the potential for assessing gesture quality with CSI
      data, showing advancement into the field of

      gesture assessment is possible.'
    team:
    - email: hdshinde@buffalo.edu
      name: name1
    - email: jlt38@buffalo.edu
      name: name2
    title: WiFi CSI Gesture Quality Recognition
