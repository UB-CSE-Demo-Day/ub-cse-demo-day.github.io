  - description: 'An immersive VR teacher training platform that enables educators
      to practice structured literacy instruction in a realistic classroom environment.
      Built with Unity and Meta Quest, the simulation features an AI-powered virtual
      student that responds authentically to teaching strategies across all five Science
      of Reading pillars: phonemic awareness, phonics, fluency, vocabulary and comprehension.

      The system leverages OpenAI''s GPT models with Retrieval-Augmented Generation
      (RAG) to deliver contextually appropriate student responses grounded in evidence-based
      reading science. A multi-agent architecture governs student behavior through
      three specialized AI agents controlling verbal responses, emotional states and
      physical actions. To ensure accuracy in early literacy instruction the platform
      integrates custom accent-aware phoneme recognition that parses isolated phonemes
      across diverse accents.

      This simulation provides educators with safe, repeatable opportunities to rehearse
      instructional techniques and refine their teaching practice before working with
      real students.'
    team:
